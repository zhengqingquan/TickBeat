<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="vexflow.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #paper {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #paper svg {
      display: block;
      max-width: 100%;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="paper"></div>
  </div>
  <script>
    var ready = false;
    var baseFg = "#1A1A1A";
    var lastKey = "c/4";

    function containerWidth(fallback) {
      var wrap = document.getElementById("wrap");
      var cw = wrap ? wrap.clientWidth : 0;
      if (cw > 0) return cw;
      var iw = window.innerWidth || document.documentElement.clientWidth || 0;
      if (iw > 0) return iw;
      return Math.max(200, fallback || 360);
    }

    function keyOctave(key) {
      var m = String(key || "").match(/\/(-?\d+)/);
      return m ? parseInt(m[1], 10) : 4;
    }

    /** Place the stave so extreme ledger lines stay inside the drawing canvas. */
    function layoutForPitch(clefName, octave) {
      // Visible box height in the Android WebView.
      var viewH = 180;
      var staveTop = 55;
      var canvasH = 300;
      if (clefName === "treble" && octave >= 6) {
        // C6–C7: many ledger lines above the staff.
        staveTop = 170;
        canvasH = 360;
      } else if (clefName === "treble" && octave >= 5) {
        staveTop = 110;
        canvasH = 320;
      } else if (clefName === "bass" && octave <= 1) {
        // C1–D1: many ledger lines below the staff.
        staveTop = 35;
        canvasH = 380;
      } else if (clefName === "bass" && octave <= 2) {
        staveTop = 40;
        canvasH = 340;
      }
      return { viewH: viewH, staveTop: staveTop, canvasH: canvasH };
    }

    function paintShape(node, fill) {
      if (!node || !fill) return;
      if (node.getAttribute("fill") !== "none") {
        node.style.fill = fill;
        node.setAttribute("fill", fill);
      }
      node.style.stroke = fill;
      node.setAttribute("stroke", fill);
    }

    /**
     * Color notehead + stem (+ filled accidental glyphs).
     * Do NOT tint ledger lines — they are fill="none" stroke paths under .vf-stavenote.
     */
    function paintNoteColor(fill) {
      var paper = document.getElementById("paper");
      if (!paper || !fill) return;
      paper.querySelectorAll(".vf-notehead path, .vf-notehead rect, .vf-notehead polygon, .vf-stem path, .vf-stem line, .vf-stem polygon").forEach(function (p) {
        paintShape(p, fill);
      });
      paper.querySelectorAll(".vf-stavenote path, .vf-stavenote polygon").forEach(function (p) {
        if (p.closest(".vf-notehead") || p.closest(".vf-stem")) return;
        if (p.getAttribute("fill") === "none") return;
        paintShape(p, fill);
      });
    }

    function fitSvgToView(paper, viewW, viewH) {
      var svg = paper.querySelector("svg");
      if (!svg) return;
      try {
        var bbox = svg.getBBox();
        if (!bbox || !(bbox.width > 0) || !(bbox.height > 0)) return;
        var pad = 12;
        var vbX = bbox.x - pad;
        var vbY = bbox.y - pad;
        var vbW = Math.max(1, bbox.width + pad * 2);
        var vbH = Math.max(1, bbox.height + pad * 2);
        svg.setAttribute("viewBox", vbX + " " + vbY + " " + vbW + " " + vbH);
        svg.setAttribute("width", String(viewW));
        svg.setAttribute("height", String(viewH));
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        svg.style.width = "100%";
        svg.style.height = viewH + "px";
        svg.style.overflow = "visible";
      } catch (e) {}
    }

    /**
     * @param key VexFlow key e.g. "c/4", "f#/5"
     * @param clef "treble" | "bass"
     * @param grade null | "correct" | "wrong"
     */
    function renderNote(key, fg, staffWidth, grade, clef) {
      ready = false;
      lastKey = key || "c/4";
      baseFg = fg || "#1A1A1A";
      var clefName = (clef === "bass") ? "bass" : "treble";
      var w = containerWidth(staffWidth);
      var octave = keyOctave(lastKey);
      var layout = layoutForPitch(clefName, octave);
      var h = layout.viewH;

      var paper = document.getElementById("paper");
      paper.innerHTML = "";
      paper.style.width = "100%";
      paper.style.height = h + "px";

      var VF = (window.Vex && window.Vex.Flow) ? window.Vex.Flow : window.VexFlow;
      if (!VF) {
        console.error("VexFlow not loaded");
        return 0;
      }

      var renderer = new VF.Renderer(paper, VF.Renderer.Backends.SVG);
      renderer.resize(w, layout.canvasH);
      var context = renderer.getContext();
      context.setFillStyle(baseFg);
      context.setStrokeStyle(baseFg);

      var marginL = 8;
      var marginR = 16;
      var staveW = Math.max(120, w - marginL - marginR);
      var stave = new VF.Stave(marginL, layout.staveTop, staveW);
      stave.addClef(clefName);
      stave.setContext(context).draw();

      var note = new VF.StaveNote({
        keys: [lastKey],
        duration: "q",
        clef: clefName,
        auto_stem: true
      });
      if (lastKey.indexOf("#") >= 0) {
        note.addModifier(new VF.Accidental("#"), 0);
      } else if (/[a-g]b\//.test(lastKey)) {
        note.addModifier(new VF.Accidental("b"), 0);
      }

      var voice = new VF.Voice({ numBeats: 4, beatValue: 4 }).setMode(VF.Voice.Mode.SOFT);
      voice.addTickables([note]);
      new VF.Formatter().joinVoices([voice]).formatToStave([voice], stave);
      voice.draw(context, stave);

      fitSvgToView(paper, w, h);

      ready = true;
      if (grade === "correct") paintNoteColor("#2E7D32");
      else if (grade === "wrong") paintNoteColor("#C62828");
      else paintNoteColor(baseFg);

      if (window.TickBeat && window.TickBeat.onNoteRendered) {
        window.TickBeat.onNoteRendered(lastKey);
      }
      return 1;
    }

    function setGrade(grade) {
      if (!ready) return;
      if (grade === "correct") paintNoteColor("#2E7D32");
      else if (grade === "wrong") paintNoteColor("#C62828");
      else paintNoteColor(baseFg);
    }
  </script>
</body>
</html>
