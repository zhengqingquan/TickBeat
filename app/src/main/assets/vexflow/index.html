<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="vexflow.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #paper {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #paper svg {
      display: block;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="paper"></div>
  </div>
  <script>
    var eventBeats = [];
    var noteEls = [];
    /** Parallel to noteEls: stem <g> for each note (beamed stems sit outside the note). */
    var noteStemEls = [];
    var durationBeats = 1;
    var ready = false;
    var drawnNotes = [];
    var fitScale = 1;
    var baseFg = "#1A1A1A";
    var hasGrades = false;
    var activeIndex = -1;
    var HIGHLIGHT = "#FF8F00";
    var PAST = "#90A4AE";

    function containerWidth(fallback) {
      var wrap = document.getElementById("wrap");
      var cw = wrap ? wrap.clientWidth : 0;
      if (cw > 0) return cw;
      var iw = window.innerWidth || document.documentElement.clientWidth || 0;
      if (iw > 0) return iw;
      return Math.max(200, fallback || 360);
    }

    function paintShape(node, fill) {
      if (!node || !fill) return;
      // Stems are stroke-only paths (fill="none"); noteheads use fill.
      node.style.stroke = fill;
      node.setAttribute("stroke", fill);
      if (node.getAttribute("fill") !== "none") {
        node.style.fill = fill;
        node.setAttribute("fill", fill);
      }
    }

    function paintStemEl(stem, fill) {
      if (!stem || !fill) return;
      stem.querySelectorAll("path, rect, line, polygon").forEach(function (p) {
        paintShape(p, fill);
        // Keep stem visible: VexFlow uses a thin stroke path.
        if (p.tagName.toLowerCase() === "path" && p.getAttribute("fill") === "none") {
          var sw = parseFloat(p.getAttribute("stroke-width") || "1.5");
          if (sw < 1.2) {
            p.setAttribute("stroke-width", "1.5");
            p.style.strokeWidth = "1.5";
          }
        }
      });
    }

    /** Color notehead in the note group + its bound stem (may be outside for beams). */
    function paintNoteIndex(i, fill) {
      var el = noteEls[i];
      if (!el || !fill) return;
      // Noteheads only — skip nested stems here; beamed stems are not children anyway.
      el.querySelectorAll(".vf-notehead path, .vf-notehead rect, .vf-notehead polygon").forEach(function (p) {
        paintShape(p, fill);
      });
      // Fallback if notehead class missing: all filled paths in the note (not stroke-only stems).
      if (!el.querySelector(".vf-notehead")) {
        el.querySelectorAll("path, rect, polygon").forEach(function (p) {
          if (p.getAttribute("fill") === "none") return;
          // Skip paths inside a stem group if any.
          if (p.closest && p.closest(".vf-stem")) return;
          paintShape(p, fill);
        });
      }
      // Accent etc. above the note.
      el.querySelectorAll(".vf-annotation path, .vf-articulation path").forEach(function (p) {
        paintShape(p, fill);
      });
      paintStemEl(noteStemEls[i], fill);
      // Non-beamed: stem lives inside the note group.
      if (!noteStemEls[i]) {
        el.querySelectorAll(".vf-stem").forEach(function (stem) {
          paintStemEl(stem, fill);
        });
      }
    }

    function paintProgress(active) {
      noteEls.forEach(function (_el, i) {
        if (active < 0) paintNoteIndex(i, baseFg);
        else if (i === active) paintNoteIndex(i, HIGHLIGHT);
        else if (i < active) paintNoteIndex(i, PAST);
        else paintNoteIndex(i, baseFg);
      });
    }

    /**
     * Beamed eighths: StaveNote skips drawStem; Beam.drawStems draws .vf-stem
     * as siblings under SVG (not inside .vf-stavenote). Bind by stem X.
     */
    function bindNoteStems(paper) {
      noteStemEls = [];
      var stems = Array.from(paper.querySelectorAll(".vf-stem"));
      var used = [];
      drawnNotes.forEach(function (d, i) {
        var noteEl = noteEls[i];
        var inner = noteEl ? noteEl.querySelector(".vf-stem") : null;
        if (inner) {
          noteStemEls[i] = inner;
          used.push(inner);
          return;
        }
        noteStemEls[i] = null;
        var targetX = null;
        try {
          var n = d.note;
          if (n && typeof n.getStemX === "function") targetX = n.getStemX();
          else if (n && typeof n.getAbsoluteX === "function") targetX = n.getAbsoluteX();
        } catch (e) {}
        if (targetX == null) return;
        var best = null;
        var bestDist = 1e9;
        stems.forEach(function (stem) {
          if (used.indexOf(stem) >= 0) return;
          try {
            var bb = stem.getBBox();
            var cx = bb.x + bb.width / 2;
            var dist = Math.abs(cx - targetX);
            if (dist < bestDist) {
              bestDist = dist;
              best = stem;
            }
          } catch (e2) {}
        });
        if (best && bestDist < 20) {
          noteStemEls[i] = best;
          used.push(best);
        }
      });
      // Fallback: leftover stems ↔ unbound notes, both sorted by X.
      var unbound = [];
      for (var ui = 0; ui < noteStemEls.length; ui++) {
        if (!noteStemEls[ui]) unbound.push(ui);
      }
      if (!unbound.length) return;
      var leftover = stems.filter(function (s) { return used.indexOf(s) < 0; });
      leftover.sort(function (a, b) {
        try { return a.getBBox().x - b.getBBox().x; } catch (e) { return 0; }
      });
      unbound.sort(function (a, b) {
        try {
          var na = drawnNotes[a].note.getAbsoluteX();
          var nb = drawnNotes[b].note.getAbsoluteX();
          return na - nb;
        } catch (e) { return a - b; }
      });
      for (var k = 0; k < unbound.length && k < leftover.length; k++) {
        noteStemEls[unbound[k]] = leftover[k];
      }
    }

    /** Index of the note sounding at [beat] (last attack at or before beat). */
    function activeNoteIndex(beat) {
      if (!eventBeats.length || !noteEls.length) return -1;
      if (beat < eventBeats[0]) return -1;
      var i = 0;
      while (i + 1 < eventBeats.length && eventBeats[i + 1] <= beat) i++;
      return Math.min(i, noteEls.length - 1);
    }

    function renderScore(scoreJson, beats, duration, fg, staffWidth, maxWidth) {
      eventBeats = beats || [];
      durationBeats = Math.max(1, duration || 1);
      drawnNotes = [];
      fitScale = 1;
      ready = false;
      hasGrades = false;
      activeIndex = -1;
      baseFg = fg || "#1A1A1A";

      // Prefer real CSS width of the WebView; Android must pass dp, not physical px.
      var w = containerWidth(staffWidth || maxWidth);
      // Compact height: staff + stems/accents without large empty bands.
      var h = 120;

      var paper = document.getElementById("paper");
      paper.innerHTML = "";
      paper.style.width = "100%";
      paper.style.height = h + "px";

      var VF = (window.Vex && window.Vex.Flow) ? window.Vex.Flow : window.VexFlow;
      if (!VF) {
        console.error("VexFlow not loaded");
        return 0;
      }

      var score = typeof scoreJson === "string" ? JSON.parse(scoreJson) : scoreJson;
      var notesSpec = score.notes || [];
      var beatsPerBar = score.beatsPerBar || 4;
      var noteValue = score.noteValue || 4;

      var renderer = new VF.Renderer(paper, VF.Renderer.Backends.SVG);
      renderer.resize(w, h);
      var context = renderer.getContext();
      context.setFillStyle(fg || "#1A1A1A");
      context.setStrokeStyle(fg || "#1A1A1A");

      var marginL = 4;
      var marginR = 16;
      var staveW = Math.max(120, w - marginL - marginR);
      var stave = new VF.Stave(marginL, 10, staveW);
      stave.addTimeSignature(beatsPerBar + "/" + noteValue);
      stave.setContext(context).draw();

      var tickables = [];
      notesSpec.forEach(function (spec) {
        var dur = spec.dur || "q";
        var isRest = !!spec.rest || /r$/.test(dur);
        var note;
        if (isRest) {
          note = new VF.StaveNote({
            keys: ["b/4"],
            duration: dur.indexOf("r") >= 0 ? dur : (dur + "r"),
            clef: "treble"
          });
        } else {
          var clean = dur.replace("d", "");
          var dotted = dur.indexOf("d") >= 0;
          note = new VF.StaveNote({
            keys: ["b/4"],
            duration: clean,
            clef: "treble",
            stem_direction: VF.Stem.UP
          });
          if (dotted) {
            VF.Dot.buildAndAttach([note], { all: true });
          }
          if (spec.accent) {
            var art = new VF.Articulation("a>").setPosition(VF.Modifier.Position.ABOVE);
            note.addModifier(art, 0);
          }
        }
        tickables.push(note);
        if (!isRest) drawnNotes.push({ note: note, tBeat: spec.tBeat });
      });

      function isRestNote(n) {
        if (typeof n.isRest === "function") return n.isRest();
        if (typeof n.isRest === "boolean") return n.isRest;
        return n.noteType === "r";
      }

      var beams = [];
      try {
        beams = VF.Beam.generateBeams(
          tickables.filter(function (n) { return !isRestNote(n); })
        );
      } catch (e) {
        beams = [];
      }

      var voice = new VF.Voice({
        numBeats: beatsPerBar,
        beatValue: noteValue
      }).setMode(VF.Voice.Mode.SOFT);
      voice.addTickables(tickables);

      // Leave a modest gap after time sig / before stave end; place by attack time.
      var formatter = new VF.Formatter();
      formatter.joinVoices([voice]);
      var padAfterTimeSig = 12;
      var padBeforeEnd = 16;
      var noteStart = stave.getNoteStartX() + padAfterTimeSig;
      stave.setNoteStartX(noteStart);
      var noteEnd = stave.getNoteEndX() - padBeforeEnd;
      var available = Math.max(40, noteEnd - noteStart);
      try {
        // Creates tick contexts / metrics; positions are overridden below.
        formatter.format([voice], available, { softmaxFactor: 100 });
      } catch (e) {
        formatter.formatToStave([voice], stave);
      }

      // Place each attack at its beat within the bar (start of its timeslot).
      // The space after the last note is that note's duration — e.g. 4 quarters
      // sit at 0/25/50/75%, not stretched to the right edge.
      var barBeats = beatsPerBar > 0 ? beatsPerBar : 4;
      var usable = available;
      tickables.forEach(function (note, i) {
        var spec = notesSpec[i] || {};
        var t = typeof spec.tBeat === "number" ? spec.tBeat : 0;
        var frac = t / barBeats;
        if (frac < 0) frac = 0;
        if (frac > 1) frac = 1;
        var tc = note.getTickContext && note.getTickContext();
        if (tc && tc.setX) tc.setX(frac * usable);
      });

      voice.draw(context, stave);
      beams.forEach(function (b) {
        b.setContext(context).draw();
      });

      // If glyphs still spill past the canvas, shrink SVG to fit.
      var svg = paper.querySelector("svg");
      if (svg) {
        var contentRight = 0;
        try {
          var bbox = svg.getBBox();
          contentRight = bbox.x + bbox.width;
        } catch (e) {
          contentRight = w;
        }
        drawnNotes.forEach(function (d) {
          try {
            var ax = d.note.getAbsoluteX ? d.note.getAbsoluteX() : 0;
            if (ax > contentRight) contentRight = ax + 24;
          } catch (e2) {}
        });
        if (contentRight > w + 1) {
          fitScale = w / contentRight;
          svg.setAttribute("viewBox", "0 0 " + contentRight + " " + h);
          svg.setAttribute("width", String(w));
          svg.setAttribute("height", String(Math.round(h * fitScale)));
          svg.style.width = "100%";
          svg.style.height = "auto";
        } else {
          fitScale = 1;
          svg.setAttribute("width", String(w));
          svg.style.width = "100%";
        }
      }

      noteEls = Array.from(paper.querySelectorAll(".vf-stavenote")).filter(function (el) {
        return !el.classList.contains("vf-rest") && !el.querySelector(".vf-rest");
      });
      bindNoteStems(paper);

      ready = true;

      if (window.TickBeat) {
        if (window.TickBeat.onRendered) window.TickBeat.onRendered(drawnNotes.length);
        if (window.TickBeat.onLayout) {
          window.TickBeat.onLayout(
            w,
            Math.round(available),
            svg ? Math.round(svg.getBoundingClientRect().width) : -1
          );
        }
      }
      return 1;
    }

    function setHighlight(beat) {
      if (!ready || hasGrades) return;
      if (beat == null || beat < 0 || !eventBeats.length) {
        if (activeIndex !== -1) {
          activeIndex = -1;
          paintProgress(-1);
        }
        return;
      }
      var b = Math.max(0, Math.min(durationBeats, beat));
      var idx = activeNoteIndex(b);
      if (idx === activeIndex) return;
      activeIndex = idx;
      paintProgress(idx);
    }

    function colorNotes(grades) {
      hasGrades = true;
      activeIndex = -1;
      grades = grades || [];
      noteEls.forEach(function (_el, i) {
        var g = grades[i];
        var fill = baseFg;
        if (g === "perfect") fill = "#2E7D32";
        else if (g === "good") fill = "#F9A825";
        else if (g === "miss") fill = "#C62828";
        paintNoteIndex(i, fill);
      });
    }

    function clearHighlight() {
      if (hasGrades) return;
      if (activeIndex === -1) return;
      activeIndex = -1;
      paintProgress(-1);
    }
  </script>
</body>
</html>
